<h1>Прыклад формы</h1><p>UI-заглушка для першай ітэрацыі зменнай справаздачы.</p><form [formGroup]="form" (ngSubmit)="submit()"><label class="field">Дата <input type="date" formControlName="date"></label><label class="field">Змена <select formControlName="shift"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><label class="field">Прадукт <input formControlName="product"></label><label class="field">Колькасць <input type="number" min="0" formControlName="quantity"></label>@if (form.invalid && form.touched) { <p class="error">Запоўніце абавязковыя палі.</p> }@if (saved()) { <p role="status">Форма праверана. Захаванне будзе падключана разам з API модуля.</p> }<button type="submit">Захаваць</button></form>

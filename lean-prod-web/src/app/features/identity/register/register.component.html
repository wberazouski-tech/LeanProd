<h1>Рэгістрацыя ў LeanProd</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">Імя
    <input type="text" formControlName="displayName" autocomplete="name">
  </label>
  <label class="field">Email
    <input type="email" formControlName="email" autocomplete="username">
  </label>
  <label class="field">Пароль
    <input type="password" formControlName="password" autocomplete="new-password">
  </label>
  <p>Не менш за 12 сімвалаў: вялікая і малая літары, лічба і спецыяльны сімвал.</p>
  <label class="field">Паўтарыце пароль
    <input type="password" formControlName="confirmPassword" autocomplete="new-password">
  </label>
  @if (form.hasError('passwordsDoNotMatch') && form.controls.confirmPassword.touched) {
    <p class="error">Паролі не супадаюць.</p>
  }
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  <button type="submit" [disabled]="form.invalid || submitting()">Зарэгістравацца</button>
  <p><a routerLink="/login">Ужо ёсць уліковы запіс? Увайсці</a></p>
</form>

<div class="language-picker">
  <label for="language">{{ 'common.language' | transloco }}</label>
  <select id="language" [value]="language.current()" (change)="changeLanguage($any($event.target).value)">
    <option value="be">Беларуская</option><option value="en">English</option>
  </select>
</div>
<app-error-banner />
<router-outlet />
@if (loading.visible()) {
  <div class="global-loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <span class="global-loading-spinner" aria-hidden="true"></span>
    <span>{{ 'pageState.loading' | transloco }}</span>
  </div>
}

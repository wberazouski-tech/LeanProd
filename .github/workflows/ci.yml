name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: Server=localhost;Database=LeanProdValidation;User Id=sa;Password=NotUsed@Test123!;Encrypt=False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet tool restore
      - run: dotnet restore LeanProd.sln
      - run: dotnet format LeanProd.sln --verify-no-changes --no-restore
      - run: dotnet build LeanProd.sln -c Release --no-restore --warnaserror
      - run: dotnet ef migrations has-pending-model-changes --project LeanProd.Infrastructure --startup-project LeanProd.Api --context LeanProdDbContext --no-build --configuration Release
      - run: dotnet test tests/LeanProd.Domain.UnitTests/LeanProd.Domain.UnitTests.csproj -c Release --no-build --logger trx
      - run: dotnet test tests/LeanProd.Api.IntegrationTests/LeanProd.Api.IntegrationTests.csproj -c Release --no-build --logger trx --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/**'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-prod-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lean-prod-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile.api -t leanprod-api:ci .
      - run: docker build -f lean-prod-web/Dockerfile -t leanprod-web:ci lean-prod-web
      - name: Validate Compose
        env:
          MSSQL_SA_PASSWORD: Compose@Test123!
          JWT_SIGNING_KEY: iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
        run: docker compose config --quiet

name: leanprod

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - leanprod-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      InternalDatabase__Path: /data/leanprod-internal.db
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Https__UseRedirection: "false"
      Database__Provider: SqlServer
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=LeanProd;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Issuer: LeanProd.Api
      Jwt__Audience: LeanProd.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenMinutes: "10"
      Jwt__RefreshTokenDays: "7"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      InternalOrganization__LegalName: ${ORGANIZATION_LEGAL_NAME:-LeanProd installation}
      InternalOrganization__CountryCode: ${ORGANIZATION_COUNTRY_CODE:-BY}
      InternalOrganization__DefaultCurrencyCode: ${ORGANIZATION_CURRENCY_CODE:-BYN}
      InternalOrganization__TimeZoneId: ${ORGANIZATION_TIME_ZONE:-Europe/Minsk}
      InternalOrganization__DefaultLanguageCode: ${ORGANIZATION_LANGUAGE:-be}
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "5000:8080"
    volumes:
  leanprod-internal-data:
      - leanprod-internal-data:/data
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: lean-prod-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  leanprod-sql-data:
